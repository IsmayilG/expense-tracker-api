version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: expense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: apiuser
      POSTGRES_PASSWORD: apipassword
      POSTGRES_DB: expenses
    ports:
      - '5434:5432'
    volumes:
      - expense_data:/var/lib/postgresql/data

volumes:
  expense_data: